                </div>
            </div>

seq": 36, "desc": "215/70R15C 8PR 109/107R WR082 DEWOSTONE", "qty": 150, "fob": 29.28, "cap40hq": 1100, "note": ""}, {"seq": 37, "desc": "215/55ZR17 94W WR9096 DEWOSTONE", "qty": 120, "fob": 23.99, "cap40hq": 1050, "note": ""}, {"seq": 38, "desc": "265/70R16 112T WR682 DEWOSTONE", "qty": 20, "fob": 40.36, "cap40hq": 660, "note": "القائمة تسجّله 112S بدل 112T"}, {"seq": 39, "desc": "215/65R15 96H WR080 DEWOSTONE", "qty": 150, "fob": 22.28, "cap40hq": 1200, "note": ""}, {"seq": 40, "desc": "235/55ZR17 103W XL WR198 DEWOSTONE", "qty": 80, "fob": 29.98, "cap40hq": 880, "note": ""}, {"seq": 41, "desc": "185/60R15 84H WR080 DEWOSTONE", "qty": 40, "fob": 17.47, "cap40hq": 1650, "note": ""}, {"seq": 42, "desc": "5.00R12C 10PR 88/86Q WR081 DEWOSTONE", "qty": 200, "fob": 14.47, "cap40hq": 2300, "note": ""}, {"seq": 43, "desc": "225/70R17 108T XL WR682 DEWOSTONE", "qty": 200, "fob": 32.95, "cap40hq": 860, "note": ""}, {"seq": 44, "desc": "225/40ZR18 92W XL WR198 DEWOSTONE", "qty": 20, "fob": 25.25, "cap40hq": 960, "note": ""}, {"seq": 45, "desc": "185/55R15 82H C187 DEWOSTONE", "qty": 40, "fob": 16.8, "cap40hq": 1500, "note": ""}, {"seq": 46, "desc": "185R15C 8PR 103/102S WR082 DEWOSTONE", "qty": 100, "fob": 24.79, "cap40hq": 1280, "note": ""}, {"seq": 47, "desc": "175/50R15 75H C187 DEWOSTONE", "qty": 40, "fob": 15.68, "cap40hq": 1600, "note": ""}, {"seq": 48, "desc": "155/70R13 75T WR080 DEWOSTONE", "qty": 40, "fob": 14.37, "cap40hq": 2300, "note": ""}];

        const DEFAULT_CATALOG = INITIAL_ITEMS.map(x => ({
            desc: x.desc,
            cap40hq: x.cap40hq,
            fob: x.fob
        }));

        const STORAGE_KEY = "sawaed_clb07_pwa_v1";

        let state = {
            apiKey: "",
            activeShipmentId: "ship_clb07",
            catalog: JSON.parse(JSON.stringify(DEFAULT_CATALOG)),
            shipments: [
                {
                    id: "ship_clb07",
                    title: "CLB07-V33-AK-P41539 (DEWOSTONE)",
                    exchangeRate: 10.25,
                    profitMargin: 10,
                    containersCount: 4,
                    seaFreightUSD: 0,
                    loadingFeesUSD: 0,
                    customsLYD: 0,
                    localTransportLYD: 0,
                    unloadingTotalLYD: 0,
                    pressingTotalLYD: 0,
                    searchFilter: "",
                    items: JSON.parse(JSON.stringify(INITIAL_ITEMS))
                }
            ]
        };

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && Array.isArray(parsed.shipments) && parsed.shipments.length > 0) {
                        state = parsed;
                    }
                }
            } catch (e) {
                console.error("Storage load error:", e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error("Storage save error:", e);
            }
        }

        function getActiveShipment() {
            return state.shipments.find(s => s.id === state.activeShipmentId) || state.shipments[0];
        }

        // محرك الحسابات المطابق 100% لمعادلات ملف الإكسل CLB07-P41539
        function computeMetrics(s) {
            const rate = Number(s.exchangeRate) || 0;
            const marginPct = (Number(s.profitMargin) || 0) / 100;
            const cCount = Number(s.containersCount) || 0;
            const seaUSD = Number(s.seaFreightUSD) || 0;
            const loadUSD = Number(s.loadingFeesUSD) || 0;
            const custLYD = Number(s.customsLYD) || 0;
            const transLYD = Number(s.localTransportLYD) || 0;
            const unloadLYD = Number(s.unloadingTotalLYD) || 0;
            const pressLYD = Number(s.pressingTotalLYD) || 0;

            let totalPieces = 0;
            let totalFobUSD = 0;
            let totalEquivContainers = 0;

            s.items.forEach(item => {
                const q = Number(item.qty) || 0;
                const f = Number(item.fob) || 0;
                const cap = Number(item.cap40hq) || 1;
                totalPieces += q;
                totalFobUSD += q * f;
                totalEquivContainers += (cap > 0 ? q / cap : 0);
            });

            // معادلة F7 في الإكسل: إجمالي التكاليف التشغيلية (د.ل)
            // =(((B7+B8)*B6*B4)+(B9*B6)+(B10*B6)+B11+B12)
            const totalOperatingLYD = ((seaUSD + loadUSD) * cCount * rate) + (custLYD * cCount) + (transLYD * cCount) + unloadLYD + pressLYD;

            // معادلة F8 في الإكسل: مصاريف الحاوية الواحدة المكافئة (د.ل / حاوية)
            const costPerContainerLYD = totalEquivContainers > 0 ? (totalOperatingLYD / totalEquivContainers) : 0;

            let totalLandedLYD = 0;
            let totalSellingLYD = 0;

            const rows = s.items.map((item, idx) => {
                const q = Number(item.qty) || 0;
                const f = Number(item.fob) || 0;
                const cap = Number(item.cap40hq) || 1;

                const rowFobUSD = q * f;
                const containerShare = cap > 0 ? (q / cap) : 0; // نسبة شغل الحاوية
                const pieceExpenseLYD = cap > 0 ? (1 / cap) * costPerContainerLYD : 0; // مصاريف القطعة (د.ل)
                const landedUnitLYD = (f * rate) + pieceExpenseLYD; // التكلفة الواصلة (د.ل)
                const sellingUnitLYD = landedUnitLYD * (1 + marginPct); // سعر البيع (د.ل)
                const profitUnitLYD = sellingUnitLYD - landedUnitLYD; // الربح/قطعة (د.ل)

                totalLandedLYD += landedUnitLYD * q;
                totalSellingLYD += sellingUnitLYD * q;

                return {
                    ...item,
                    idx,
                    rowFobUSD,
                    containerShare,
                    pieceExpenseLYD,
                    landedUnitLYD,
                    sellingUnitLYD,
                    profitUnitLYD,
                    rowSellingLYD: sellingUnitLYD * q
                };
            });

            return {
                totalPieces,
                totalFobUSD,
                totalEquivContainers,
                totalOperatingLYD,
                costPerContainerLYD,
                totalLandedLYD,
                totalSellingLYD,
                totalProfitLYD: totalSellingLYD - totalLandedLYD,
                rows
            };
        }

        function renderTabs() {
            const bar = document.getElementById("tabsBar");
            if (!bar) return;
            bar.innerHTML = state.shipments.map(s => `

                </button>

        }

        function renderApp() {
            renderTabs();
            const s = getActiveShipment();
            const m = computeMetrics(s);
            const body = document.getElementById("appBody");
            if (!body) return;

            const filterTxt = (s.searchFilter || "").trim().toLowerCase();
            const filteredRows = filterTxt
                ? m.rows.filter(r => r.desc.toLowerCase().includes(filterTxt) || (r.note && r.note.toLowerCase().includes(filterTxt)))
                : m.rows;

            body.innerHTML = `
                <!-- 1. بطاقة عنوان الشحنة وأزرار التصدير -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg no-print flex flex-wrap justify-between items-center gap-3">
                    <div class="flex-1 min-w-[220px]">
                        <label class="block text-[11px] text-slate-400 mb-1">اسم / رقم الشحنة:</label>
                        <input type="text" value="${escapeHtml(s.title)}" onchange="updateField('title', this.value)"
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm sm:text-base font-extrabold text-amber-400 outline-none">
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button type="button" onclick="window.print()" class="bg-emerald-600 active:bg-emerald-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs sm:text-sm shadow">🖨️ طباعة / PDF للزبائن</button>
                        <button type="button" onclick="sendWhatsApp()" class="bg-green-600 active:bg-green-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs sm:text-sm shadow">💬 إرسال واتساب</button>
                        <button type="button" onclick="removeShipment()" class="bg-rose-950 border border-rose-800 text-rose-300 px-3 py-2 rounded-xl text-xs">حذف</button>

        function escapeHtml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");

        function selectShipment(id) {
            state.activeShipmentId = id;
            saveState();
            renderApp();

        function createNewShipment() {
            const id = "ship_" + Date.now();
            state.shipments.push({
                id,
                title: "شحنة جديدة #" + (state.shipments.length + 1),
                exchangeRate: getActiveShipment().exchangeRate || 10.25,
                profitMargin: 10,
                containersCount: 1,
                seaFreightUSD: 0,
                loadingFeesUSD: 0,
                customsLYD: 0,
                localTransportLYD: 0,
                unloadingTotalLYD: 0,
                pressingTotalLYD: 0,
                searchFilter: "",
                items: [
                    { seq: 1, desc: "195/65R15 91H C187 DEWOSTONE", qty: 100, fob: 18.88, cap40hq: 1380, note: "" }
                ]
            });
            state.activeShipmentId = id;
            saveState();
            renderApp();
        }

        function removeShipment() {
            if (state.shipments.length <= 1) {
                alert("لا يمكن حذف الشحنة الوحيدة.");
                return;
            }
            if (confirm("هل أنت متأكد من حذف هذه الشحنة؟")) {
                state.shipments = state.shipments.filter(s => s.id !== state.activeShipmentId);
                state.activeShipmentId = state.shipments[0].id;
                saveState();
                renderApp();
            }
        }

        function updateField(key, val) {
            getActiveShipment()[key] = val;
            saveState();
            renderTabs();
        }

        function updateNum(key, val) {
            getActiveShipment()[key] = Number(val) || 0;
            saveState();
            renderApp();
        }

        function updateSearch(val) {
            getActiveShipment().searchFilter = val;
            renderApp();
        }

        function updateRow(idx, key, val) {
            const item = getActiveShipment().items[idx];
            if (!item) return;
            if (key === "desc" || key === "note") {
                item[key] = val;
            } else {
                item[key] = Number(val) || 0;
            }
            saveState();
            renderApp();
        }

        function deleteRow(idx) {
            getActiveShipment().items.splice(idx, 1);
            saveState();
            renderApp();
        }

        function addBlankRow() {
            const s = getActiveShipment();
            s.items.push({ seq: s.items.length + 1, desc: "مقاس جديد DEWOSTONE", qty: 40, fob: 20.0, cap40hq: 1000, note: "" });
            saveState();
            renderApp();
        }

        function addFromCatalog() {
            const sel = document.getElementById("quickCatalogSelect");
            if (!sel) return;
            const c = state.catalog[Number(sel.value)];
            if (!c) return;
            const s = getActiveShipment();
            s.items.push({ seq: s.items.length + 1, desc: c.desc, qty: 40, fob: c.fob, cap40hq: c.cap40hq, note: "" });
            saveState();
            renderApp();
        }

        function sendWhatsApp() {
            const s = getActiveShipment();
            const m = computeMetrics(s);
            let msg = `*شركة سواعد الغد الحديثة للإطارات والنضائد*\nعرض أسعار: ${s.title}\n\n`;
            m.rows.forEach((r, i) => {
                msg += `${i + 1}. ${r.desc} ⬅️ *${r.sellingUnitLYD.toFixed(2)} د.ل*\n`;
            });
            msg += `\n📞 0914340100 - 0914340200\n*الأسعار قابلة للتغيير دون إشعار مسبق.`;
            window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
        }

        function openModal(id) {
            if (id === "catalogModal") renderCatalog();
            if (id === "settingsModal") document.getElementById("geminiKeyInput").value = state.apiKey || "";
            const el = document.getElementById(id);
            el.classList.remove("hidden");
            el.classList.add("flex");
        }

        function closeModal(id) {
            const el = document.getElementById(id);
            el.classList.add("hidden");
            el.classList.remove("flex");
        }

        function renderCatalog() {
            const tbody = document.getElementById("catalogList");
            if (!tbody) return;
            tbody.innerHTML = state.catalog.map((c, i) => `
                <tr>
                    <td class="p-2 font-bold text-white">${escapeHtml(c.desc)}</td>
                    <td class="p-2 text-center text-amber-400 font-bold">${c.cap40hq}</td>
                    <td class="p-2 text-center">$${c.fob}</td>
                    <td class="p-2 text-center"><button type="button" onclick="deleteCat(${i})" class="text-rose-400 font-bold">✕</button></td>
                </tr>
            `).join('');
        }

        function saveToCatalog() {
            const desc = document.getElementById("catDesc").value.trim();
            const cap = Number(document.getElementById("catCap").value) || 1000;
            const fob = Number(document.getElementById("catFob").value) || 20;
            if (!desc) { alert("أدخل المقاس والماركة."); return; }
            state.catalog.unshift({ desc, cap40hq: cap, fob });
            saveState();
            renderCatalog();
            renderApp();
            document.getElementById("catDesc").value = "";
        }

        function deleteCat(i) {
            state.catalog.splice(i, 1);
            saveState();
            renderCatalog();
            renderApp();
        }

        function resetCatalog() {
            if (confirm("استعادة قاعدة DEWOSTONE الأصلية؟")) {
                state.catalog = JSON.parse(JSON.stringify(DEFAULT_CATALOG));
                saveState();
                renderCatalog();
                renderApp();
            }
        }

        function saveSettings() {
            state.apiKey = document.getElementById("geminiKeyInput").value.trim();
            saveState();
            closeModal("settingsModal");
            alert("تم حفظ الإعدادات.");
        }

        function downloadBackup() {
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "sawaed_clb07_backup_" + Date.now() + ".json";
            a.click();
            URL.revokeObjectURL(url);
        }

        function uploadBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && Array.isArray(parsed.shipments)) {
                        state = parsed;
                        saveState();
                        renderApp();
                        closeModal("settingsModal");
                        alert("تمت استعادة النسخة الاحتياطية بنجاح!");
                    }
                } catch (err) {
                    alert("ملف النسخة الاحتياطية غير صالح.");
                }
            };
            reader.readAsText(file);
        }

        function triggerAI() {
            if (!state.apiKey) {
                const k = prompt("أدخل مفتاح Gemini API Key لقراءة الفاتورة:");
                if (!k || !k.trim()) return;
                state.apiKey = k.trim();
                saveState();
            }
            const inp = document.getElementById("aiFile");
            inp.value = "";
            inp.click();
        }

        async function processAIFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const banner = document.getElementById("aiBanner");
            banner.classList.remove("hidden");
            try {
                const base64 = await new Promise((res, rej) => {
                    const r = new FileReader();
                    r.onload = () => res(r.result.split(",")[1]);
                    r.onerror = rej;
                    r.readAsDataURL(file);
                });
                const prompt = `Extract tire or battery invoice lines into a strict JSON array. Each object must have:
- "desc": string (full size, pattern, brand, e.g. "195/65R15 91H C187 DEWOSTONE")
- "qty": number
- "fob": number (unit FOB price in USD)
- "cap40hq": number (estimated 40HQ container loading capacity in pieces, e.g., 1380 for 195/65R15, 2000 for 175/70R13, 660 for 265/70R16)
Return ONLY raw JSON array.`;

                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(state.apiKey)}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: file.type || "image/jpeg", data: base64 } }
                            ]
                        }]
                    })
                });
                const json = await resp.json();
                if (json.error) throw new Error(json.error.message);
                const rawTxt = json.candidates[0].content.parts[0].text.replace(/```json/gi, "").replace(/```/g, "").trim();
                const extracted = JSON.parse(rawTxt);

                const newId = "ship_" + Date.now();
                state.shipments.push({
                    id: newId,
                    title: "فاتورة AI (" + new Date().toLocaleDateString("ar-LY") + ")",
                    exchangeRate: getActiveShipment().exchangeRate || 10.25,
                    profitMargin: 10,
                    containersCount: 1,
                    seaFreightUSD: 0,
                    loadingFeesUSD: 0,
                    customsLYD: 0,
                    localTransportLYD: 0,
                    unloadingTotalLYD: 0,
                    pressingTotalLYD: 0,
                    searchFilter: "",
                    items: extracted.map((x, idx) => ({
                        seq: idx + 1,
                        desc: x.desc || "صنف مستخرج",
                        qty: Number(x.qty) || 40,
                        fob: Number(x.fob) || 20,
                        cap40hq: Number(x.cap40hq) || 1000,
                        note: ""
                    }))
                });
                state.activeShipmentId = newId;
                saveState();
                renderApp();
                alert("✅ تم استخراج " + extracted.length + " صنف وإنشاء شحنة جديدة بنجاح!");
            } catch (err) {
                alert("❌ خطأ في قراءة الفاتورة: " + err.message);
            } finally {
                banner.classList.add("hidden");
            }
        }

        // دعم PWA Manifest الديناميكي
        try {
            const manifest = {
                name: "سواعد الغد - تسعير الحاويات والشحنات",
                short_name: "سواعد الغد",
                start_url: "./sawaed_clb07.html",
                display: "standalone",
                background_color: "#090d16",
                theme_color: "#f59e0b",
                icons: [{
                    src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23f59e0b'/><text x='50' y='64' font-size='44' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23090d16'>SG</text></svg>",
                    sizes: "192x192",
                    type: "image/svg+xml"
                }]
            };
            const mLink = document.createElement("link");
            mLink.rel = "manifest";
            mLink.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/json" }));
            document.head.appendChild(mLink);
        } catch (e) {}

        // تشغيل فوري
        loadState();
        renderApp();
    </script>
</body>
</html>
